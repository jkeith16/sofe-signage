<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>SOFE Live Tracker — UTK OSFL</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FF8200; --orange-dk:#CC6600; --black:#0A0A0A; --white:#FFFFFF;
  --smoky:#58595B; --smoky-lt:#9A9C9E; --bg:#0E0E10; --card:#18181B; --card2:#1F1F23;
  --green:#3FB46B; --red:#E0564F; --gold:#FFB347; --live:#FF8200;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);
  font-family:'Montserrat',sans-serif;color:var(--white)}
.stage-wrap{position:fixed;top:0;left:0;width:100vw;height:100vh;overflow:hidden;background:var(--bg)}
.canvas{width:1920px;height:1080px;position:absolute;top:0;left:0;transform-origin:top left;flex:none}

.header{position:absolute;top:0;left:0;right:0;height:118px;background:var(--orange);
  display:flex;align-items:center;justify-content:space-between;padding:0 56px;z-index:10}
.hleft{display:flex;align-items:center;gap:26px}
.logo{height:84px;width:auto;display:block}
.hsep{width:3px;height:64px;background:rgba(0,0,0,.28)}
.htitle{font-size:38px;font-weight:800;color:#000;line-height:1;letter-spacing:-.5px}
.hsub{font-size:17px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:rgba(0,0,0,.62);margin-top:6px}
.hright{display:flex;align-items:center;gap:16px}
.livepill{display:flex;align-items:center;gap:10px;background:#000;border-radius:30px;
  padding:10px 22px}
.livedot{width:13px;height:13px;border-radius:50%;background:var(--orange);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.4)}}
.livetext{font-size:19px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#fff}

.stage{position:absolute;top:118px;left:0;right:0;bottom:64px;padding:28px 56px}
.page{position:absolute;inset:28px 56px;opacity:0}
.page.p1{animation:showCY 28s infinite}
.page.p2{animation:showAY 28s infinite}
@keyframes showCY{0%,2%{opacity:0;transform:translateX(28px)}6%,46%{opacity:1;transform:translateX(0)}50%,100%{opacity:0;transform:translateX(-28px)}}
@keyframes showAY{0%,50%{opacity:0;transform:translateX(28px)}54%,94%{opacity:1;transform:translateX(0)}98%,100%{opacity:0;transform:translateX(-28px)}}

.pagehead{display:flex;align-items:center;gap:18px;margin-bottom:10px}
.pagetag{font-size:16px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:7px 18px;border-radius:6px}
.tag-cy{background:rgba(255,130,0,.16);color:var(--orange);border:2px solid rgba(255,130,0,.4)}
.tag-ay{background:rgba(255,179,71,.14);color:var(--gold);border:2px solid rgba(255,179,71,.4)}
.tag-ip{background:rgba(255,130,0,.12);color:var(--orange);border:2px solid rgba(255,130,0,.3)}
.pagetitle{font-size:32px;font-weight:800}
.pagenote{margin-left:auto;font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--smoky-lt)}
.legend{display:flex;gap:26px;margin-bottom:18px;padding-left:2px}
.legitem{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;letter-spacing:.5px;color:var(--smoky-lt)}
.legswatch{width:26px;height:11px;border-radius:3px}
.sw-live{background:var(--orange)}
.sw-off{background:rgba(255,255,255,.22)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 40px;align-content:start}
.grid.single{grid-template-columns:1fr;max-width:1150px;margin:0 auto}
.trow{background:var(--card);border-radius:10px;padding:12px 22px;border-left:5px solid var(--card2)}
.trow.up{border-left-color:var(--green)}
.trow.mover{border-left-color:var(--orange)}
.trowtop{display:flex;align-items:center;gap:14px;margin-bottom:9px}
.trank{font-size:23px;font-weight:800;color:var(--smoky-lt);min-width:34px;font-variant-numeric:tabular-nums}
.trow.mover .trank{color:var(--orange)}
.torg{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.tcur{font-size:30px;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums}
.tcursm{font-size:15px;font-weight:700;color:var(--smoky-lt);margin-left:3px}
.bars{display:flex;flex-direction:column;gap:5px}
.barline{display:grid;grid-template-columns:62px 1fr 54px;align-items:center;gap:11px}
.barlbl{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.barlbl.live{color:var(--orange)}
.barlbl.off{color:var(--smoky-lt)}
.track{height:11px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px}
.fill.live{background:var(--orange)}
.fill.off{background:rgba(255,255,255,.22)}
.barval{font-size:16px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.barval.live{color:var(--orange)}
.barval.off{color:var(--smoky-lt)}

.footer{position:absolute;bottom:0;left:0;right:0;height:64px;background:var(--black);
  display:flex;align-items:center;justify-content:space-between;padding:0 56px;z-index:10}
.fleft{font-size:17px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--orange)}
.fright{font-size:15px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--smoky-lt)}
.dots{display:flex;gap:10px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.2)}
.dot.d1{animation:dotCY 28s infinite}
.dot.d2{animation:dotAY 28s infinite}
@keyframes dotCY{0%,48%{background:var(--orange);width:30px;border-radius:6px}50%,100%{background:rgba(255,255,255,.2);width:11px;border-radius:50%}}
@keyframes dotAY{0%,50%{background:rgba(255,255,255,.2);width:11px;border-radius:50%}52%,100%{background:var(--orange);width:30px;border-radius:6px}}
</style>
</head>

// ---- AUTO-SCALE 1920x1080 canvas to fit any screen (robust) ----
(function(){
  function fit(){
    var c=document.querySelector('.canvas');
    if(!c)return;
    var ws=[window.innerWidth,document.documentElement.clientWidth,document.body.clientWidth].filter(function(x){return x>0;});
    var hs=[window.innerHeight,document.documentElement.clientHeight,document.body.clientHeight].filter(function(x){return x>0;});
    var sw=Math.min.apply(null,ws), sh=Math.min.apply(null,hs);
    if(!sw||!sh||sw===Infinity||sh===Infinity)return;
    var scale=Math.min(sw/1920, sh/1080);
    var offX=(sw-1920*scale)/2;
    var offY=(sh-1080*scale)/2;
    c.style.transform='translate('+offX+'px,'+offY+'px) scale('+scale+')';
  }
  window.addEventListener('resize',fit);
  window.addEventListener('load',fit);
  document.addEventListener('DOMContentLoaded',fit);
  // aggressive retries to catch late iframe sizing
  fit();
  var n=0, iv=setInterval(function(){fit();n++;if(n>20)clearInterval(iv);},250);
  setInterval(fit,3000);
})();
