<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOFE Digital Signage — UTK OSFL</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── UTK Brand ─────────────────────────────────────
   Orange #FF8200  → black text only
   White  #FFFFFF  → any text
   Smoky  #58595B  → white text OK
   Black  #000000  → white text
   ─────────────────────────────────────────────── */
:root {
  --orange: #FF8200;
  --orange-dk: #CC6600;
  --black: #000000;
  --white: #FFFFFF;
  --smoky: #58595B;
  --smoky-lt: #A0A2A4;
  --bg-dark: #111111;
  --bg-card: #1A1A1A;
  --green: #1B6B3A;
  --red: #B91C1C;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 1920px; height: 1080px;
  overflow: hidden;
  background: var(--bg-dark);
  font-family: 'Source Sans 3', sans-serif;
  color: var(--white);
}

/* ── PERSISTENT HEADER ──────────────────────────── */
.header {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 100px;
  background: var(--orange);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 60px;
  z-index: 100;
}
.hdr-left { display: flex; align-items: center; gap: 20px; }
.hdr-T {
  font-family: 'Montserrat', sans-serif;
  font-size: 64px; font-weight: 700;
  color: var(--black); line-height: 1;
  letter-spacing: -2px;
}
.hdr-sep { width: 3px; height: 52px; background: rgba(0,0,0,0.3); }
.hdr-text {}
.hdr-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 28px; font-weight: 600;
  color: var(--black); line-height: 1; letter-spacing: 0.5px;
}
.hdr-sub {
  font-size: 14px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: rgba(0,0,0,0.55); margin-top: 3px;
}
.hdr-right { display: flex; align-items: center; gap: 30px; }
.hdr-date {
  font-family: 'Montserrat', sans-serif;
  font-size: 22px; font-weight: 500;
  color: rgba(0,0,0,0.65); letter-spacing: 0.5px;
}
.slide-dots {
  display: flex; gap: 10px; align-items: center;
}
.dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: rgba(0,0,0,0.25);
  transition: all .4s ease;
}
.dot.active {
  background: var(--black);
  width: 28px; border-radius: 5px;
}

/* ── PERSISTENT FOOTER ──────────────────────────── */
.footer {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 50px;
  background: var(--black);
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 60px;
  z-index: 100;
}
.footer-l {
  font-size: 14px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--orange);
}
.footer-r {
  font-size: 13px; letter-spacing: 1px;
  text-transform: uppercase; color: var(--smoky-lt);
}

/* ── SLIDE CONTAINER ────────────────────────────── */
.slides {
  position: absolute;
  top: 100px; left: 0; right: 0; bottom: 50px;
}
.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: translateX(60px);
  transition: opacity .7s ease, transform .7s ease;
  pointer-events: none;
  padding: 40px 60px 36px;
  display: flex; flex-direction: column; gap: 22px;
}
.slide.active {
  opacity: 1; transform: translateX(0);
  pointer-events: auto;
}
.slide.exit {
  opacity: 0; transform: translateX(-60px);
}

/* ── SLIDE TITLES ───────────────────────────────── */
.slide-title {
  display: flex; align-items: baseline; gap: 16px;
  flex-shrink: 0;
}
.slide-title-text {
  font-family: 'Montserrat', sans-serif;
  font-size: 36px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--white); line-height: 1;
}
.slide-title-sub {
  font-size: 15px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--orange);
}
.title-bar {
  height: 4px; background: var(--orange);
  width: 80px; margin-top: 8px; flex-shrink: 0;
}

/* ── LEADERBOARD ROWS ───────────────────────────── */
.lb {
  display: flex; flex-direction: column;
  gap: 10px; flex: 1; min-height: 0;
}
.lb-row {
  display: grid;
  grid-template-columns: 72px 1fr 80px 340px;
  align-items: center; gap: 0;
  background: var(--bg-card);
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
  opacity: 0;
  transform: translateX(40px);
  transition: opacity .5s ease, transform .5s ease;
}
.lb-row.in { opacity: 1; transform: translateX(0); }

.lb-rank {
  background: var(--orange);
  height: 100%; display: flex; align-items: center; justify-content: center;
  font-family: 'Montserrat', sans-serif;
  font-size: 30px; font-weight: 700;
  color: var(--black);
  padding: 14px 0;
  min-width: 72px;
}
.lb-rank.gold-rank  { background: var(--orange); }
.lb-rank.silver-rank{ background: #A0A2A4; }
.lb-rank.bronze-rank{ background: #8B7355; }
.lb-rank.other-rank { background: var(--bg-card); color: var(--smoky-lt); font-size: 22px; }

.lb-org {
  padding: 12px 20px;
  font-family: 'Montserrat', sans-serif;
  font-size: 24px; font-weight: 500;
  color: var(--white); letter-spacing: 0.3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lb-status {
  padding: 12px 8px;
  font-size: 20px;
  text-align: center;
}

/* ── DUAL SCORE COLUMN ── */
.lb-scores {
  padding: 8px 20px 8px 0;
  display: flex; flex-direction: column; gap: 5px;
}
.lb-score-row {
  display: grid;
  grid-template-columns: 90px 1fr 58px;
  align-items: center; gap: 8px;
}
.lb-score-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 1.2px; text-transform: uppercase;
}
.lb-score-label.official { color: var(--orange); }
.lb-score-label.live     { color: #A0A2A4; }
.lb-bar-track {
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px; overflow: hidden;
}
.lb-bar-fill {
  height: 100%; border-radius: 4px;
  transition: width 1.2s ease;
  width: 0;
}
.lb-bar-fill.official { background: var(--orange); }
.lb-bar-fill.live     { background: rgba(255,130,0,0.35); }
.lb-score-val {
  font-family: 'Montserrat', sans-serif;
  font-size: 20px; font-weight: 700;
  text-align: right;
}
.lb-score-val.official { color: var(--orange); }
.lb-score-val.live     { color: #A0A2A4; }

/* ── SNAPSHOT SLIDE ─────────────────────────────── */
.snapshot {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 16px; flex: 1; min-height: 0;
}
.snap-card {
  background: var(--bg-card);
  border-radius: 10px;
  padding: 28px 30px;
  display: flex; flex-direction: column;
  justify-content: center;
  opacity: 0; transform: translateY(24px);
  transition: opacity .5s ease, transform .5s ease;
  border-top: 4px solid var(--orange);
}
.snap-card.in { opacity: 1; transform: translateY(0); }
.snap-card.highlight {
  background: var(--orange);
  border-top-color: rgba(0,0,0,0.2);
}
.snap-label {
  font-size: 13px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--smoky-lt); margin-bottom: 8px;
}
.snap-card.highlight .snap-label { color: rgba(0,0,0,0.55); }
.snap-value {
  font-family: 'Montserrat', sans-serif;
  font-size: 62px; font-weight: 700;
  line-height: 1; letter-spacing: -1px; color: var(--white);
}
.snap-card.highlight .snap-value { color: var(--black); }
.snap-sub {
  font-size: 15px; font-weight: 600; color: var(--smoky-lt);
  margin-top: 6px;
}
.snap-card.highlight .snap-sub { color: rgba(0,0,0,0.6); }
.snap-champs {
  display: flex; flex-direction: column; gap: 6px; margin-top: 8px;
}
.snap-champ-row {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 500;
  color: var(--white); letter-spacing: 0.3px;
}
.snap-champ-score {
  font-size: 18px; color: var(--orange); font-weight: 700;
}
.snap-card.span2 { grid-column: span 2; }
.snap-perf-grid {
  display: flex; flex-direction: column; gap: 8px; margin-top: 4px;
}
.perf-row {
  display: grid; grid-template-columns: 1fr 60px 100px; align-items: center; gap: 12px;
}
.perf-name { font-size: 18px; font-weight: 600; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.perf-score-text { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 700; color: var(--orange); text-align: right; }
.perf-bar-track { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.perf-bar-fill { height: 100%; border-radius: 3px; background: var(--orange); transition: width 1.2s ease; width: 0; }

/* ── PROGRESS BAR ───────────────────────────────── */
.progress-bar {
  position: absolute;
  bottom: 50px; left: 0;
  height: 4px;
  background: var(--orange);
  width: 0%;
  transition: width linear;
  z-index: 99;
}

/* ── CYCLE TAG ──────────────────────────────────── */
.cycle-tag {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 4px 14px; border-radius: 4px;
}
.tag-cy { background: rgba(0,91,142,.25); color: #6BB8D6; border: 1px solid rgba(0,91,142,.4); }
.tag-ay { background: rgba(88,89,91,.35); color: #C0C1C3; border: 1px solid rgba(88,89,91,.5); }
.tag-official { background: rgba(27,107,58,.25); color: #6BC98B; border: 1px solid rgba(27,107,58,.4); }
.tag-ip { background: rgba(255,130,0,.15); color: var(--orange); border: 1px solid rgba(255,130,0,.3); }
</style>
</head>

// HELPERS
// ═══════════════════════════════════════════════
function statusEmoji(s) {
  if (!s) return '';
  if (s.includes('★★★')) return '★★★';
  if (s.includes('★★'))  return '★★';
  if (s.includes('★'))   return '★';
  if (/unacceptable/i.test(s)) return '⚠';
  if (/provisional/i.test(s))  return '◎';
  return '';
}

function statusColor(s) {
  if (!s) return '#A0A2A4';
  if (s.includes('★★★')) return '#FFB347';
  if (s.includes('★★'))  return '#C0C1C3';
  if (s.includes('★'))   return '#A0A2A4';
  if (/unacceptable/i.test(s)) return '#E87070';
  if (/provisional/i.test(s))  return '#CC9944';
  return '#A0A2A4';
}

function lbRowHTML(r, i, rankOverride) {
  const rank = rankOverride !== undefined ? rankOverride : i + 1;
  const rankCls = i === 0 ? 'gold-rank' : i === 1 ? 'silver-rank' : i === 2 ? 'bronze-rank' : 'other-rank';
  const rankLbl = i < 3 ? (i + 1).toString() : rank.toString();
  const officialPct = Math.min(r.total, 100);
  const currentPct  = Math.min(r.current || 0, 100);
  const cycleYear   = r.cycle === 'CY' ? 'CY2026' : 'AY26-27';
  return `
    <div class="lb-row" data-delay="${i * 80}">
      <div class="lb-rank ${rankCls}">${rankLbl}</div>
      <div class="lb-org">${r.org}</div>
      <div class="lb-status" style="color:${statusColor(r.status)};font-size:18px;font-weight:700">${statusEmoji(r.status)}</div>
      <div class="lb-scores">
        <div class="lb-score-row">
          <div class="lb-score-label official">Official ʼ25</div>
          <div class="lb-bar-track"><div class="lb-bar-fill official" data-pct="${officialPct}"></div></div>
          <div class="lb-score-val official">${r.total}</div>
        </div>
        <div class="lb-score-row">
          <div class="lb-score-label live">${cycleYear} ⚡</div>
          <div class="lb-bar-track"><div class="lb-bar-fill live" data-pct="${currentPct}"></div></div>
          <div class="lb-score-val live">${r.current || 0}</div>
        </div>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════
// SLIDESHOW ENGINE
// ═══════════════════════════════════════════════
const SLIDE_DURATION = 9000; // ms per slide
const TOTAL_SLIDES = 5;
let current = 0;
let timer = null;
let progressTimer = null;

function buildDots() {
  const d = document.getElementById('dots');
  d.innerHTML = '';
  for (let i = 0; i < TOTAL_SLIDES; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.id = `dot-${i}`;
    d.appendChild(dot);
  }
}

function animateRowsIn(slideEl) {
  // LB rows
  slideEl.querySelectorAll('.lb-row').forEach(row => {
    const delay = parseInt(row.dataset.delay || 0);
    setTimeout(() => row.classList.add('in'), delay + 100);
  });
  // snap cards
  slideEl.querySelectorAll('.snap-card').forEach(card => {
    const delay = parseInt(card.dataset.delay || 0);
    setTimeout(() => card.classList.add('in'), delay + 100);
  });
  // animate bar fills
  setTimeout(() => {
    slideEl.querySelectorAll('.lb-bar-fill[data-pct], .perf-bar-fill[data-pct]').forEach(bar => {
      bar.style.width = Math.min(bar.dataset.pct, 100) + '%';
    });
  }, 300);
}

function resetRows(slideEl) {
  slideEl.querySelectorAll('.lb-row').forEach(r => r.classList.remove('in'));
  slideEl.querySelectorAll('.snap-card').forEach(r => r.classList.remove('in'));
  slideEl.querySelectorAll('.lb-bar-fill, .perf-bar-fill').forEach(b => b.style.width = '0');
}

function goTo(idx) {
  const slides = document.querySelectorAll('.slide');
  const prevSlide = slides[current];
  const nextSlide = slides[idx];

  prevSlide.classList.add('exit');
  prevSlide.classList.remove('active');
  setTimeout(() => {
    prevSlide.classList.remove('exit');
    resetRows(prevSlide);
  }, 700);

  current = idx;
  nextSlide.classList.add('active');
  animateRowsIn(nextSlide);

  // dots
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === idx);
  });

  // footer cycle label
  const labels = [
    'CY2025 Official Standings — Calendar Year Chapters',
    'CY2025 Official Standings — Calendar Year Chapters',
    'AY25-26 Official Standings — Academic Year Chapters',
    'SOFE 2025–2026 Community Summary',
    'CY2026 In Progress — Not Official Until November 2026',
  ];
  document.getElementById('footerCycle').textContent = labels[idx] || '';

  startProgress();
}

function next() {
  goTo((current + 1) % TOTAL_SLIDES);
}

function startProgress() {
  const bar = document.getElementById('progressBar');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      bar.style.transition = `width ${SLIDE_DURATION}ms linear`;
      bar.style.width = '100%';
    });
  });
  clearTimeout(progressTimer);
  progressTimer = setTimeout(next, SLIDE_DURATION);
}

function updateDate() {
  const now = new Date();
  const opts = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
  document.getElementById('hdrDate').textContent = now.toLocaleDateString('en-US', opts);
}

// ═══════════════════════════════════════════════
// LIVE DATA — SharePoint List fetch
// Falls back to hardcoded data if unavailable
// ═══════════════════════════════════════════════
const SP_SITE    = 'https://liveutk.sharepoint.com/sites/OSFLUTK';
const SP_LIST    = 'SOFEScores';
const SP_API     = `${SP_SITE}/_api/web/lists/getbytitle('${SP_LIST}')/items` +
                   `?$select=org,total,status,cycle,list_rank,Current_score` +
                   `&$orderby=list_rank asc&$top=200`;
const REFRESH_MS = 30 * 60 * 1000;

function setLiveIndicator(state) {
  const el = document.getElementById('liveIndicator');
  if (!el) return;
  const cfg = {
    live:     { text: '● LIVE',     color: '#4eca8b' },
    fallback: { text: '○ CACHED',   color: '#CC9944' },
    loading:  { text: '◌ SYNCING', color: '#A0A2A4' },
  };
  el.textContent = cfg[state].text;
  el.style.color  = cfg[state].color;
}

async function fetchLiveData() {
  setLiveIndicator('loading');
  try {
    const res = await fetch(SP_API, {
      headers: { 
        Accept: 'application/json;odata=verbose'
      },
      mode: 'cors'
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const items = json?.d?.results;
    if (!items || items.length === 0) throw new Error('Empty list');

    const cy = items
      .filter(r => r.cycle === 'CY')
      .sort((a, b) => (a.list_rank || 999) - (b.list_rank || 999))
      .map(r => ({ org: r.org, total: +r.total, status: r.status || '', current: +(r.Current_score || 0) }));

    const ay = items
      .filter(r => r.cycle === 'AY')
      .sort((a, b) => (a.list_rank || 999) - (b.list_rank || 999))
      .map(r => ({ org: r.org, total: +r.total, status: r.status || '', current: +(r.Current_score || 0) }));

    if (cy.length > 0) { CY_STANDINGS.length = 0; cy.forEach(r => CY_STANDINGS.push(r)); }
    if (ay.length > 0) { AY_STANDINGS.length = 0; ay.forEach(r => AY_STANDINGS.push(r)); }

    document.getElementById('slides').innerHTML = '';
    buildSlides();
    goTo(0);
    setLiveIndicator('live');
    console.log(`[SOFE] Live — ${cy.length} CY, ${ay.length} AY`);
  } catch (err) {
    setLiveIndicator('fallback');
    console.warn('[SOFE] Using cached data:', err.message);
  }
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
buildDots();

updateDate();

animateRowsIn(firstSlide);

// Fetch live data on load, then every 30 min
fetchLiveData();
setInterval(fetchLiveData, REFRESH_MS);
</script>
