<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruitment &amp; Intake — UTK OSFL</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FF8200; --orange-dk:#CC6600; --bg:#0A0A0B; --bg2:#101013;
  --card:#161619; --line:rgba(255,255,255,.08); --smoke:#9A9C9E; --smoke-d:#5C5D60; --white:#F5F5F2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);
  font-family:'Montserrat',sans-serif;color:var(--white)}
html{background:#0A0A0B !important} body{background:#0A0A0B !important}
.stage-wrap{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;background:var(--bg);
  display:flex;align-items:flex-start;justify-content:center}
.canvas{width:1920px;height:1080px;flex:none;transform-origin:top center;position:relative;overflow:hidden;
  transform:scale(min(100vw/1920,100vh/1080));
  background:
    radial-gradient(1100px 700px at 86% -8%, rgba(255,130,0,.20), transparent 60%),
    radial-gradient(900px 620px at -6% 112%, rgba(255,130,0,.10), transparent 60%),
    var(--bg);}
/* fine grid + grain + sweeping beam */
.canvas::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
   linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px) 0 0/64px 64px,
   linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px) 0 0/64px 64px;}
.beam{position:absolute;top:-30%;left:-30%;width:60%;height:160%;z-index:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,130,0,.10),transparent);
  transform:skewX(-14deg);animation:sweep 14s linear infinite}
@keyframes sweep{0%{left:-40%}100%{left:130%}}

/* header */
.head{position:absolute;top:0;left:0;right:0;height:128px;display:flex;align-items:center;
  justify-content:space-between;padding:0 64px;z-index:10}
.head::after{content:'';position:absolute;left:64px;right:64px;bottom:0;height:2px;
  background:linear-gradient(90deg,var(--orange) 0 220px,rgba(255,255,255,.10) 220px)}
.hl{display:flex;align-items:center;gap:26px}
.logo{height:78px;width:auto;display:block;border-radius:14px;box-shadow:0 12px 34px rgba(255,130,0,.35)}
.hsep{width:2px;height:62px;background:rgba(255,255,255,.16)}
.htitle{font-size:36px;font-weight:900;letter-spacing:-.5px;line-height:1}
.hsub{font-size:14px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--smoke);margin-top:8px}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.pill{display:inline-flex;align-items:center;gap:12px;border:2px solid var(--orange);border-radius:999px;
  padding:10px 20px;font-weight:800;font-size:18px;letter-spacing:2px;text-transform:uppercase;color:var(--orange)}
.pdot{width:13px;height:13px;border-radius:50%;background:var(--orange);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,130,0,.55)}70%{box-shadow:0 0 0 16px rgba(255,130,0,0)}100%{box-shadow:0 0 0 0 rgba(255,130,0,0)}}
.hterm{font-size:15px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--smoke)}

/* body grid: rail | main | qr */
.body{position:absolute;top:128px;left:0;right:0;bottom:72px;display:grid;
  grid-template-columns:360px 1fr 560px;z-index:5}

/* rail */
.rail{padding:48px 40px 48px 64px;display:flex;flex-direction:column;justify-content:center;gap:6px;
  border-right:1px solid var(--line)}
.ritem{display:flex;align-items:center;gap:20px;padding:16px 16px;border-radius:12px;position:relative;
  opacity:.45;transition:all .5s ease}
.ritem .rn{font-size:16px;font-weight:800;color:var(--smoke);width:30px;font-variant-numeric:tabular-nums}
.ritem .rl{font-size:23px;font-weight:800;letter-spacing:.3px}
.ritem .rbar{position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:0;
  background:var(--orange);border-radius:3px;transition:height .5s ease}
.ritem.on{opacity:1;background:linear-gradient(90deg,rgba(255,130,0,.12),transparent)}
.ritem.on .rn{color:var(--orange)}
.ritem.on .rbar{height:64%}

/* main */
.main{position:relative;padding:60px 60px}
.panel{position:absolute;inset:60px 60px;opacity:0;visibility:hidden;display:flex;flex-direction:column;justify-content:center;
  transition:opacity .5s ease}
.panel.on{opacity:1;visibility:visible}
.crest{width:158px;height:158px;border-radius:50%;margin-bottom:24px;opacity:0;transform:scale(.82) translateY(12px);filter:drop-shadow(0 14px 34px rgba(0,0,0,.55))}
.panel.on .crest{animation:crestin .6s .12s forwards cubic-bezier(.2,.8,.2,1)}
@keyframes crestin{to{opacity:1;transform:scale(1) translateY(0)}}
.kick{font-size:18px;font-weight:800;letter-spacing:5px;text-transform:uppercase;color:var(--orange);margin-bottom:18px}
.title{font-size:118px;font-weight:900;line-height:.9;letter-spacing:-3px;text-transform:uppercase}
.title .o{color:var(--orange)}
.title .ln{display:block;overflow:hidden}
.title .ln span{display:block;transform:translateY(110%)}
.panel.on .title .ln span{animation:rise .7s forwards cubic-bezier(.2,.75,.2,1)}
.panel.on .title .ln:nth-child(2) span{animation-delay:.09s}
@keyframes rise{to{transform:translateY(0)}}
.divide{height:6px;width:0;background:var(--orange);border-radius:3px;margin:34px 0 30px}
.panel.on .divide{animation:grow .7s .25s forwards}
@keyframes grow{to{width:300px}}
.stat{font-size:30px;font-weight:600;color:var(--white);opacity:0}
.stat b{color:var(--orange);font-weight:800}
.deck{font-size:23px;font-weight:500;color:var(--smoke);max-width:620px;margin-top:14px;line-height:1.4;opacity:0}
.cue{margin-top:42px;display:inline-flex;align-items:center;gap:18px;font-size:30px;font-weight:800;
  letter-spacing:1px;text-transform:uppercase;color:var(--white);opacity:0}
.cue .arw{width:60px;height:3px;background:var(--orange);position:relative}
.cue .arw::after{content:'';position:absolute;right:0;top:-6px;width:14px;height:14px;border-top:3px solid var(--orange);border-right:3px solid var(--orange);transform:rotate(45deg)}
.panel.on .stat{animation:fade .6s .42s forwards}
.panel.on .deck{animation:fade .6s .52s forwards}
.panel.on .cue{animation:fade .6s .62s forwards}
@keyframes fade{to{opacity:1}}

/* qr */
.qrcol{display:flex;align-items:center;justify-content:center;padding:48px 64px 48px 20px}
.qrcard{width:440px;background:#fff;border-radius:26px;padding:38px 38px 30px;text-align:center;
  box-shadow:0 0 0 1px rgba(255,130,0,.5), 0 30px 80px rgba(0,0,0,.6), 0 0 70px rgba(255,130,0,.30)}
.qrcard .scan{color:#0A0A0B;font-weight:900;font-size:22px;letter-spacing:3px;text-transform:uppercase;margin-bottom:22px}
.qrbox{width:360px;height:360px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.qrbox img,.qrbox canvas{width:360px!important;height:360px!important;image-rendering:pixelated}
.qrurl{margin-top:22px;color:var(--orange-dk);font-weight:800;font-size:20px;word-break:break-all}
.qrhint{margin-top:6px;color:#9A9C9E;font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase}

/* footer + progress */
.foot{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;align-items:center;
  justify-content:space-between;padding:0 64px;z-index:10;border-top:1px solid var(--line)}
.fl{font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--orange)}
.fr{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--smoke)}
.prog{position:absolute;left:0;bottom:0;height:4px;background:var(--orange);width:0;box-shadow:0 0 14px rgba(255,130,0,.7)}
</style>
</head>

  panels.forEach(function(p,i){

      '<div class="kick">'+p.dataset.kick+'</div>'+
      '<div class="title"><span class="ln"><span>'+p.dataset.t1+'</span></span><span class="ln"><span>'+p.dataset.t2+'</span></span></div>'+
      '<div class="divide"></div>'+
      '<div class="stat">'+p.dataset.stat+'</div>'+
      '<div class="deck">'+p.dataset.deck+'</div>'+
      '<div class="cue">'+p.dataset.cue+'<span class="arw"></span></div>';
    var ri=document.createElement('div'); ri.className='ritem';
    ri.innerHTML='<span class="rbar"></span><span class="rn">0'+(i+1)+'</span><span class="rl">'+p.dataset.rail+'</span>';
    rail.appendChild(ri);
  });
  var rails=Array.prototype.slice.call(rail.children);

  // pre-make QR codes (cache) to swap fast
  var qrcache={};
  function setQR(p){
    qrbox.innerHTML='';
    try{ new QRCode(qrbox,{text:p.dataset.url,width:360,height:360,colorDark:'#0A0A0B',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }
    catch(e){ qrbox.textContent='QR'; }
    qrurl.textContent=p.dataset.urltext; scanlbl.textContent=p.dataset.scan; footc.textContent=p.dataset.kick;
  }

  var idx=0;
  function show(n){
    panels.forEach(function(p,i){ p.classList.toggle('on',i===n); });
    rails.forEach(function(r,i){ r.classList.toggle('on',i===n); });
    setQR(panels[n]);
    // restart progress bar
    prog.style.transition='none'; prog.style.width='0%';
    void prog.offsetWidth;
    prog.style.transition='width '+HOLD+'ms linear'; prog.style.width='100%';
  }
  show(0);
  setInterval(function(){ idx=(idx+1)%panels.length; show(idx); }, HOLD);
